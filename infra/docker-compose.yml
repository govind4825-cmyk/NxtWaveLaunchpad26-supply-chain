name: rasad

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: rasad
      POSTGRES_PASSWORD: rasad
      POSTGRES_DB: rasad
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rasad"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  traccar:
    image: traccar/traccar:latest
    ports:
      - "8082:8082"   # web UI and REST API
      - "5055:5055"   # OsmAnd protocol used by the Traccar Client phone app
    volumes:
      - traccar-data:/opt/traccar/data
      - traccar-logs:/opt/traccar/logs

  graphhopper:
    build: ./graphhopper
    environment:
      # One Geofabrik extract for the region you demo, e.g. an India zone file from
      # https://download.geofabrik.de/asia/india.html (copy the .osm.pbf link).
      OSM_PBF_URL: ${OSM_PBF_URL:-}
      JAVA_OPTS: ${GH_JAVA_OPTS:--Xmx4g}
    volumes:
      - gh-data:/data
    ports:
      - "8989:8989"

  api:
    build: ..
    env_file:
      - ../.env
    environment:
      RASAD_DATABASE_URL: postgresql://rasad:rasad@db:5432/rasad
      RASAD_REDIS_URL: redis://redis:6379/0
      RASAD_TRACCAR_URL: http://traccar:8082
      RASAD_GRAPHHOPPER_URL: http://graphhopper:8989
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      traccar:
        condition: service_started
      graphhopper:
        condition: service_started

volumes:
  gh-data:
  pgdata:
  traccar-data:
  traccar-logs:
